<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}MediaPlatform{% endblock %}</title>
  {% load static %}
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Lora:ital@0;1&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="{% static 'css/base.css' %}"/>
  {% block extra_css %}{% endblock %}
</head>
<body>
  {% if messages %}
  <div class="toast-container" id="toasts">
    {% for msg in messages %}
    <div class="toast toast--{{ msg.tags }}" role="alert">
      <span>{{ msg }}</span>
      <button class="toast__close" onclick="this.parentElement.remove()">×</button>
    </div>
    {% endfor %}
  </div>
  {% endif %}

  {% block body %}{% endblock %}

  <script src="{% static 'js/base.js' %}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
