{% load static %}<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Resend Verification — MediaPlatform</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="{% static 'css/theme.css' %}"/>
</head>
<body>
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg);">
  <div class="card card-shadow" style="max-width:420px;width:100%;padding:40px 36px;">
    <h2 style="margin-bottom:8px;">Resend verification email</h2>
    <p style="color:var(--ink-3);font-size:0.9rem;margin-bottom:24px;">Enter your email address and we'll send a new verification link.</p>
    <form method="post">
      {% csrf_token %}
      <div class="field" style="margin-bottom:16px;">
        <label>Email address</label>
        <input type="email" name="email" class="input" placeholder="your@email.com" required/>
      </div>
      <button type="submit" class="btn btn-primary btn-full">Send verification link</button>
    </form>
    <div style="text-align:center;margin-top:16px;"><a href="{% url 'accounts:auth' %}" style="font-size:0.84rem;color:var(--ink-3);">← Back to login</a></div>
  </div>
</div>
</body></html>
