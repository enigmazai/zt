{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Access Denied — MediaPlatform</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="{% static 'css/base.css' %}"/>
</head>
<body>
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg);">
  <div style="text-align:center;max-width:420px;">
    <div style="font-size:4rem;margin-bottom:16px;">🔒</div>
    <h1 style="font-size:1.5rem;font-weight:700;margin-bottom:8px;">Access Denied</h1>
    <p style="color:var(--ink-3);margin-bottom:8px;">
      Your account role (<strong>{{ user_role }}</strong>) does not have permission to access this page.
    </p>
    {% if required_roles %}
    <p style="font-size:0.82rem;color:var(--ink-3);margin-bottom:24px;">
      Required: {{ required_roles|join:", " }}
    </p>
    {% endif %}
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
      <a href="{% url 'media:dashboard' %}" class="btn btn--primary">Go to my dashboard</a>
      <a href="{% url 'accounts:request_role' %}" class="btn btn--outline">Request role upgrade</a>
    </div>
  </div>
</div>
</body>
</html>
