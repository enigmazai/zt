{% extends 'base.html' %}
{% block title %}Verify — MediaPlatform{% endblock %}
{% block body %}
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1a56db 0%,#1e3a8a 100%);padding:24px;">
  <div style="background:#fff;border-radius:20px;box-shadow:0 24px 64px rgba(0,0,0,0.2);width:100%;max-width:400px;padding:40px 36px;">
    <div style="text-align:center;margin-bottom:28px;">
      <div style="width:56px;height:56px;background:#eff6ff;border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;">
        <svg width="26" height="26" fill="none" stroke="#1a56db" stroke-width="1.8" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      </div>
      <h2 style="font-size:1.4rem;font-weight:700;margin-bottom:6px;">Two-factor verification</h2>
      <p style="font-size:0.87rem;color:#64748b;">Enter the 6-digit code from your authenticator app.</p>
    </div>

    {% if form.token.errors %}
    <div style="padding:10px 14px;background:#fef2f2;border:1px solid #fecaca;border-radius:8px;color:#dc2626;font-size:0.84rem;margin-bottom:16px;">
      {{ form.token.errors.0 }}
    </div>
    {% endif %}

    <form method="post" novalidate>
      {% csrf_token %}
      <div style="margin-bottom:20px;">
        <input type="text" name="token" maxlength="6" minlength="6"
          inputmode="numeric" pattern="[0-9]{6}"
          autocomplete="one-time-code"
          placeholder="000000"
          autofocus
          style="font-size:2rem;letter-spacing:0.5em;text-align:center;padding:16px;border:1.5px solid #e2e8f0;border-radius:12px;width:100%;outline:none;transition:border-color 0.18s;"
          onfocus="this.style.borderColor='#1a56db'"
          onblur="this.style.borderColor='#e2e8f0'"/>
      </div>
      <button type="submit" style="width:100%;padding:13px;background:#1a56db;color:#fff;border:none;border-radius:10px;font-size:0.95rem;font-weight:600;cursor:pointer;box-shadow:0 4px 14px rgba(26,86,219,0.3);">
        Verify
      </button>
    </form>
    <div style="text-align:center;margin-top:16px;">
      <a href="{% url 'accounts:auth' %}" style="font-size:0.84rem;color:#94a3b8;">← Back to login</a>
    </div>
  </div>
</div>
{% endblock %}
