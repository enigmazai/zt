{% extends 'base.html' %}
{% block body %}
<main class="page">
  <div class="container" style="max-width: 520px;">
    <section class="card card--shadow">
      <h1 style="margin-bottom: 8px;">Reset your password</h1>
      <p style="margin-bottom: 24px;">Enter your email address and we’ll send reset instructions.</p>
      <form method="post" class="flex" style="flex-direction: column; gap: 16px;">
        {% csrf_token %}
        <div class="field">
          <label for="id_email">Email address</label>
          <input type="email" name="email" id="id_email" autocomplete="email" required autofocus>
        </div>
        <button type="submit" class="btn btn--primary btn--full">Send reset link</button>
      </form>
      <p style="margin-top: 20px;"><a href="{% url 'accounts:auth' %}">Back to sign in</a></p>
    </section>
  </div>
</main>
{% endblock %}
